<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GSUhub: Facility Damage Reporting and Maintenance Management System for Davao Oriental State University">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GSUhub">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GSUhub</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!--
    Registers the Cloud Messaging service worker for background web push.

    The worker's Firebase config is NOT written here. Dart hands it over at
    runtime via postMessage (see web/firebase-messaging-sw.js), which keeps
    project-specific values out of version control — the same rule the Dart
    side follows with --dart-define.

    Registration failure is logged, not fatal: web push is an enhancement,
    and the admin dashboard must still load without it.
  -->
  <script>
    window.gsuhubRegisterMessagingWorker = function (firebaseConfig) {
      if (!('serviceWorker' in navigator)) {
        console.info('GSUhub: service workers unsupported; web push off.');
        return;
      }
      navigator.serviceWorker
        .register('firebase-messaging-sw.js')
        .then(function (registration) {
          var target = registration.active || registration.installing;
          if (target) {
            target.postMessage({
              type: 'FIREBASE_CONFIG',
              config: firebaseConfig,
            });
          }
        })
        .catch(function (error) {
          console.error('GSUhub: messaging worker registration failed', error);
        });
    };
  </script>
</body>
</html>
