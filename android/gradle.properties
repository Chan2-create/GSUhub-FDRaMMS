org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin's incremental compiler cannot compute a relative path between two
# files on different Windows drive letters (this project is on D:, the
# pub cache and Kotlin daemon live under C:\Users\...). That throws
# "this and base files have different roots" and fails the build. This is
# a known Windows-specific limitation, not a project misconfiguration —
# see docs/architecture_decisions.md. Disabling incremental compilation
# avoids the code path that hits it; the cost is a full (not incremental)
# Kotlin recompile every build, which is fine at this project's current
# size.
kotlin.incremental=false
